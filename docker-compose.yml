services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: checksum
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d checksum"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app itself. `docker compose up -d postgres redis` still gives you just the infra
  # for running the API/worker from source; `docker compose up -d --build` runs everything.
  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/checksum
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on: *app-deps
    healthcheck:
      disable: true # no HTTP port; the image's healthcheck is for the API

volumes:
  pgdata:
